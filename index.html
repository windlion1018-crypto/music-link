<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DAY DREAM BEAT | ハンブレッダーズ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 50px 24px;
      text-align: center;
    }

    .cover {
      width: 220px;
      height: 220px;
      margin: 0 auto 28px;
      border-radius: 18px;
      background: linear-gradient(135deg, #333, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 8px;
    }

    .artist {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 38px;
    }

    .listen {
      font-size: 13px;
      color: #888;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .service {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 20px;
      margin: 12px 0;
      background: #202020;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
    }

    .service:active {
      transform: scale(.98);
    }

    .arrow {
      color: #777;
    }

    footer {
      margin-top: 45px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="cover">♫</div>

    <h1>DAY DREAM BEAT</h1>

    <div class="artist">
      ハンブレッダーズ
    </div>

    <div class="listen">
      LISTEN NOW
    </div>

    <a class="service"
       href="https://open.spotify.com/search/DAY%20DREAM%20BEAT%20ハンブレッダーズ">
      <span>Spotify</span>
      <span class="arrow">›</span>
    </a>

    <a class="service"
       href="https://music.apple.com/jp/search?term=DAY%20DREAM%20BEAT%20ハンブレッダーズ">
      <span>Apple Music</span>
      <span class="arrow">›</span>
    </a>

    <a class="service"
       href="https://music.youtube.com/search?q=DAY%20DREAM%20BEAT%20ハンブレッダーズ">
      <span>YouTube Music</span>
      <span class="arrow">›</span>
    </a>

    <footer>
      MUSIC LINK
    </footer>

  </main>

</body>
</html>
