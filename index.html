<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DAY DREAM BEAT | ハンブレッダーズ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  position: relative;
  background: #111;
}

body::before {
  content: "";
  position: fixed;
  inset: -40px;
  background-image: url("IMG_5114.jpeg");
  background-size: cover;
  background-position: center;
  filter: blur(35px);
  transform: scale(1.15);
  opacity: 0.65;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: -1;
}

    .container {
      width: 100%;
      max-width: 430px;
      padding: 50px 24px;
      text-align: center;
    }

    .cover {
      width: 220px;
      height: 220px;
      margin: 0 auto 28px;
      border-radius: 18px;
      background: linear-gradient(135deg, #333, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 8px;
    }

    .artist {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 38px;
    }

    .listen {
      font-size: 13px;
      color: #888;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .service {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 18px 20px;
  margin: 12px 0;
  background: rgba(35, 35, 35, 0.65);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: white;
  text-decoration: none;
  border-radius: 20px;
  font-size: 17px;
  font-weight: 600;
}
    .service-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.service-icon {
  width: 32px;
  height: 32px;
  object-fit: contain;
  flex-shrink: 0;
}
    .service:active {
      transform: scale(.98);
    }

    .arrow {
      color: #777;
    }

    footer {
      margin-top: 45px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

<img class="cover" src="IMG_5114.jpeg" alt="ハンブレッダーズ">

    <h1>DAY DREAM BEAT</h1>

    <div class="artist">
      ハンブレッダーズ
    </div>

    <div class="listen">
      LISTEN NOW
    </div>

  <a class="service"
   href="https://open.spotify.com/intl-ja/track/3RTwBdZ4AbiIwiUwcblBCs">
  <span class="service-left">
    <img class="service-icon" src="IMG_5161.png" alt="Spotify">
    <span>Spotify</span>
  </span>
  <span class="arrow">›</span>
</a>

<a class="service"
   href="https://music.apple.com/jp/album/day-dream-beat/1538287798?i=1538287799">
  <span class="service-left">
    <img class="service-icon" src="IMG_5162.png" alt="Apple Music">
    <span>Apple Music</span>
  </span>
  <span class="arrow">›</span>
</a>
    
<a class="service"
   href="https://music.youtube.com/watch?v=ErXPIpBaAww&amp;si=KckRZceMGh0Yrnia">
  <span class="service-left">
    <img class="service-icon" src="IMG_5165.png" alt="YouTube Music">
    <span>YouTube Music</span>
  </span>
  <span class="arrow">›</span>
</a>

<a class="service"
   href="https://lin.ee/7FGmgYu">
  <span class="service-left">
    <img class="service-icon" src="IMG_5160.png" alt="LINE MUSIC">
    <span>LINE MUSIC</span>
  </span>
  <span class="arrow">›</span>
</a>

<a class="service"
   href="https://music.rakuten.co.jp/link/album/4841937/song/35350654/">
  <span class="service-left">
    <img class="service-icon" src="IMG_5163.webp" alt="Rakuten Music">
    <span>Rakuten Music</span>
  </span>
  <span class="arrow">›</span>
</a>

<a class="service"
   href="https://music.amazon.co.jp/tracks/B078NXCN2F?marketplaceId=A1VC38T7YXB528&amp;musicTerritory=JP&amp;ref=dm_sh_ARzHShfkpF78GSeU6BzgC1A7J">
  <span class="service-left">
    <img class="service-icon" src="IMG_5164.png" alt="Amazon Music">
    <span>Amazon Music</span>
  </span>
  <span class="arrow">›</span>
</a>
    <footer>
      MUSIC LINK
    </footer>

  </main>

</body>
</html>
